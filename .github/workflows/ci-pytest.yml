name: CI — pytest

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'feat/*' ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
            pip install pytest-cov
          else
            pip install pytest pyfakefs pytest-cov
          fi

      - name: Run tests
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml -q tests

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Skip Codecov upload (no token)
        if: ${{ secrets.CODECOV_TOKEN == '' }}
        run: echo 'CODECOV_TOKEN not set; skipping Codecov upload.'

  test-windows:
    name: Run tests (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip (Windows)
        uses: actions/cache@v4
        with:
          path: C:\\Users\\runneradmin\\AppData\\Local\\pip\\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if exist requirements-dev.txt (
            pip install -r requirements-dev.txt
            pip install pytest-cov
          ) else (
            pip install pytest pyfakefs pytest-cov
          )

      - name: Run tests
        run: |
          py -3 -m pytest --cov=. --cov-report=xml:coverage.xml -q tests

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Skip Codecov upload (no token)
        if: ${{ secrets.CODECOV_TOKEN == '' }}
        run: echo 'CODECOV_TOKEN not set; skipping Codecov upload.'
